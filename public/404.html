<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Page not found | FiveFour</title>
    <style>
      :root {
        --ink: #0a0a0a;
        --cream: #f1efe9;
        --muted: #8f8f8f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--ink);
        color: var(--cream);
        font-family: "Geist Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .wrap { text-align: center; max-width: 560px; }
      .code {
        font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
        font-size: clamp(96px, 22vw, 180px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--cream);
        opacity: 0.14;
        margin: 0;
        user-select: none;
      }
      h1 {
        font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
        font-size: clamp(26px, 5vw, 36px);
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin: -28px 0 0;
      }
      p { font-size: 15px; line-height: 1.65; color: var(--muted); margin: 16px 0 32px; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: var(--ink);
        font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        text-decoration: none;
        border-radius: 6px;
        padding: 14px 28px;
        transition: background-color 0.2s ease, transform 0.2s ease;
      }
      .btn:hover { background-color: #e6e6e6; }
      .btn:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="code" aria-hidden="true">404</p>
      <h1>404 — Page not found</h1>
      <p>The page you're looking for doesn't exist.</p>
      <a class="btn" href="/">Back to Home</a>
    </div>
  </body>
</html>
